[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "one-adapter-one-pass"
version = "0.1.0"
description = "One Adapter, One Pass: Are Modular Adapters Necessary for Class-Incremental Learning?"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "timm==1.0.27",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "tqdm>=4.66",
]

[project.optional-dependencies]
figures = ["matplotlib>=3.8"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
    "matplotlib>=3.8",
    "pre-commit>=4.6.2",
]

[tool.ruff]
line-length = 88
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.setuptools]
packages = ["datasets", "methods", "models", "utils"]
py-modules = ["runner", "train", "evaluate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
