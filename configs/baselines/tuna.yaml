# TUNA (ICCV 2025) on the shared ImageNet-R protocol; official exps/tuna_imgr.json values.
method: tuna
learning_rate: 0.02
weight_decay: 0.0005
batch_size: 32
epochs: 10
adapter_dim: 16
adapter_scale: 0.1
adapter_dropout: 0.1
scale: 20.0
margin: 0.0
orth_reg: 0.001
use_orth: true
ca_epochs: 30
ca_lr: 0.005
ca_decay: true
